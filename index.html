<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #wrap {
      background: #0a0a0a;
      border: 0.5px solid #2a2218;
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #head {
      padding: 16px 20px;
      border-bottom: 0.5px solid #2a2218;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #1a1508;
      border: 0.5px solid #c9a84c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    #headtext h2 {
      font-size: 14px;
      font-weight: 600;
      color: #e8d5a3;
      letter-spacing: 0.3px;
    }
    #headtext p {
      font-size: 11px;
      color: #6b5c3e;
      margin-top: 2px;
    }
    #status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #6b5c3e;
    }
    #statusdot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c9a84c;
    }
    #msgwrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 52px;
      font-weight: 600;
      color: #c9a84c;
      opacity: 0.04;
      letter-spacing: 6px;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
    #msgs {
      height: 100%;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
    }
    #msgs::-webkit-scrollbar { width: 3px; }
    #msgs::-webkit-scrollbar-thumb { background: #2a2218; border-radius: 3px; }
    .msg { display: flex; gap: 10px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }
    .av {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .av.bot { background: #1a1508; border: 0.5px solid #c9a84c; color: #c9a84c; }
    .av.user { background: #1a1a1a; border: 0.5px solid #3a3a3a; color: #888; }
    .bub {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.75;
      white-space: pre-wrap;
    }
    .bub.bot { background: #110f08; border: 0.5px solid #2a2218; color: #d4bc8a; }
    .bub.user { background: #151515; border: 0.5px solid #2a2a2a; color: #aaa; }
    .bub.typing { color: #6b5c3e; font-style: italic; }
    #chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 10px 20px 8px;
      flex-shrink: 0;
    }
    .chip {
      font-size: 11.5px;
      padding: 5px 13px;
      border-radius: 20px;
      border: 0.5px solid #2a2218;
      background: #0f0d07;
      color: #8a7040;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { border-color: #c9a84c; color: #c9a84c; }
    #bottom {
      padding: 10px 20px 16px;
      border-top: 0.5px solid #2a2218;
      flex-shrink: 0;
    }
    #inputrow { display: flex; gap: 8px; }
    #inp {
      flex: 1;
      font-size: 13.5px;
      padding: 10px 15px;
      border-radius: 10px;
      border: 0.5px solid #2a2218;
      background: #0f0d07;
      color: #d4bc8a;
      outline: none;
      transition: border-color 0.15s;
    }
    #inp:focus { border-color: #c9a84c; }
    #inp::placeholder { color: #3a2e1a; }
    #sendbtn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 0.5px solid #c9a84c;
      background: #1a1508;
      color: #c9a84c;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    #sendbtn:hover { background: #251d0a; }
    #sendbtn:disabled { opacity: 0.3; cursor: not-allowed; }
    #disc { font-size: 11px; color: #3a2e1a; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="head">
      <div id="logo">⬡</div>
      <div id="headtext">
        <h2>Crypto AI</h2>
        <p>Edukasi crypto · Bahasa Indonesia</p>
      </div>
      <div id="status">
        <div id="statusdot"></div>
        Online
      </div>
    </div>

    <div id="msgwrap">
      <div id="watermark">CRYPTO AI</div>
      <div id="msgs">
        <div class="msg bot">
          <div class="av bot">AI</div>
          <div class="bub bot">Selamat datang. Tanya apapun tentang crypto — Bitcoin, Ethereum, DeFi, NFT, atau cara mulai investasi. Semua dijawab dalam Bahasa Indonesia yang mudah dipahami. 🚀</div>
        </div>
      </div>
    </div>

    <div id="chips">
      <button class="chip" onclick="sendChip('Apa itu Bitcoin?')">Apa itu Bitcoin?</button>
      <button class="chip" onclick="sendChip('Apa itu DeFi?')">Apa itu DeFi?</button>
      <button class="chip" onclick="sendChip('Bagaimana cara beli crypto pertama kali?')">Cara beli crypto</button>
      <button class="chip" onclick="sendChip('Apa itu blockchain?')">Blockchain</button>
      <button class="chip" onclick="sendChip('Apa perbedaan Bitcoin dan Ethereum?')">BTC vs ETH</button>
    </div>

    <div id="bottom">
      <div id="inputrow">
        <input id="inp" type="text" placeholder="Tanya tentang crypto..." onkeydown="if(event.key==='Enter') sendMsg()" />
        <button id="sendbtn" onclick="sendMsg()">➤</button>
      </div>
      <div id="disc">⚠️ Hanya untuk edukasi · Bukan saran investasi</div>
    </div>
  </div>

  <script>
    const msgs = document.getElementById('msgs');
    const inp = document.getElementById('inp');
    const btn = document.getElementById('sendbtn');
    const history = [];

    function addMsg(role, text, typing) {
      const w = document.createElement('div');
      w.className = 'msg ' + role;
      const av = document.createElement('div');
      av.className = 'av ' + role;
      av.textContent = role === 'bot' ? 'AI' : 'Kamu';
      const b = document.createElement('div');
      b.className = 'bub ' + role + (typing ? ' typing' : '');
      b.textContent = text;
      w.appendChild(av);
      w.appendChild(b);
      msgs.appendChild(w);
      msgs.scrollTop = msgs.scrollHeight;
      return b;
    }

    async function sendChip(t) { inp.value = t; await sendMsg(); }

    async function sendMsg() {
      const t = inp.value.trim();
      if (!t) return;
      inp.value = '';
      btn.disabled = true;
      addMsg('user', t);
      history.push({ role: 'user', content: t });
      const lb = addMsg('bot', 'Sedang menjawab...', true);
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        const d = await r.json();
        const reply = d.reply || 'Maaf, ada gangguan. Coba lagi ya.';
        lb.textContent = reply;
        lb.classList.remove('typing');
        history.push({ role: 'assistant', content: reply });
      } catch (e) {
        lb.textContent = 'Koneksi bermasalah. Coba lagi.';
        lb.classList.remove('typing');
      }
      btn.disabled = false;
      inp.focus();
      msgs.scrollTop = msgs.scrollHeight;
    }
  </script>
</body>
</html>
